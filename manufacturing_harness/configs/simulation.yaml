# ==============================================================================
# 로봇 물리 시뮬레이션 전용 상세 설정 파일 (simulation.yaml)
# ==============================================================================

# 시뮬레이터 물리 엔진 및 환경 구성
engine:
  name: mujoco                  # 물리 계산 엔진 (mujoco, pybullet 등)
  version: "3.6.0"               # 지원 엔진 버전
  solver: Newton                # 물리 구동 솔버 (Newton, PGS 등)
  iterations: 50                # 솔버 반복 계산 횟수 (높을수록 정밀함)

# 로봇 모델 정보 (Franka Emika Panda 로봇)
robot:
  name: franka_emika_panda       # 로봇 기종 명칭
  dof: 7                        # 자유도 (Degree of Freedom)
  joint_limits:                 # 관절 동작 범위 한계 (각도/라디안)
    lower: [-2.8973, -1.7628, -2.8973, -3.0718, -2.8973, -0.0175, -2.8973]
    upper: [2.8973, 1.7628, 2.8973, -0.0698, 2.8973, 3.7525, 2.8973]
  home_position: [0.0, -0.785, 0.0, -2.356, 0.0, 1.571, 0.785] # 기본 홈 위치 (라디안)

# 카메라 및 시각화 품질 설정
visualization:
  width: 1280                   # 화면 해상도 너비 (픽셀)
  height: 720                   # 화면 해상도 높이 (픽셀)
  fps: 60                       # 화면 재생 빈도 (초당 프레임 수)
  shadows: true                 # 그림자 효과 활성화 여부
